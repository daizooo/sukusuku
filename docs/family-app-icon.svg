<!-- かぞく手帳のアイコン原図（D4→「白」版）。108x108 は Android adaptive icon の座標系。
     屋根は3人の色（青=大造 / 翠=岳 / 桃=いづみ）、屋根の下は「白」（白石家の頭文字）。
     「白」は点（ノ）を中央に寄せ、「日」の角を丸めてある。線はすべて丸端・丸継ぎ。
     アイコン一式（mobile/assets/・PWA）はこの原図から書き出す（docs/family-app.md §4.4） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <rect width="108" height="108" fill="#ffffff"/>
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 44 L39 33" stroke="#3b82f6"/>
    <path d="M39 33 L54 22 L69 33" stroke="#10b981"/>
    <path d="M69 33 L84 44" stroke="#ec4899"/>
  </g>
  <g fill="none" stroke="#33313d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 35 L53 46"/>
    <rect x="40" y="54" width="28" height="35" rx="6"/>
    <path d="M40 71.500 H68"/>
  </g>
</svg>
