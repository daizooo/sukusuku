# mobile/（Androidネイティブ版）の .apk を作る。
#
# 凍結の原因は「開発環境にAndroid SDKが無く、mobile/ へ入れたものが実機で一度も
# 動いていない」ことだった（docs/native-app-rewrite.md の【現況】）。PWA側が
# Vercelのプレビューで PRごとに実機で確かめられるのと同じ状態を、ネイティブ側にも
# 用意して原因そのものを潰す。
#
# Androidのフルビルドは**手動実行(workflow_dispatch)のときだけ**行う。PRでは
# Actionsの実行時間を使わない型チェックだけを行う。
#
# 以前はmainへのpush(マージ)ごとにビルドして配っていたが、1回18分かかるため
# マージのたびに無料枠を削り、実際に使い切った（2026-09-23）。配るのは「端末に
# 入れて使いたくなったとき」だけでよく、複数のPRをまとめて1回のビルドで配れる。
# 手元でビルドできるようにしておけば、日々の確認はそちらで足りる
# （docs/mobile-local-build.md）。CIの役目は「誰の環境でも同じものが出る、
# 家族へ配るための正式なビルド」に絞る。
#
# 配りたいとき: Actionsの "mobile APK" > Run workflow（distribute を on のまま実行）。
# 動くかどうかだけ見たいとき: distribute を off にすると Artifacts に .apk が残る。
#
# ストアには出さない方針（docs/native-app-rewrite.md §8、docs/store-release.md）。
name: mobile APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:
    inputs:
      distribute:
        description: 'Firebase App Distribution で家族の端末へ配る'
        type: boolean
        default: true

# 同じブランチへ続けてpushしたときは古い実行を止める（Actionsの時間を無駄にしない）。
concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRでは型チェックのみ（Androidのフルビルドは手動実行に限る）。
  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.81 のビルドには JDK 17 以上が要る。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ランナーにAndroid SDKは入っているので、ここではライセンス同意だけさせる。
      # packages を空にしないと、既に無くなった `tools` を入れようとして失敗する。
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - run: npm ci

      - run: npm run typecheck

      # 通知(FCM)の設定。app.config.js が android.googleServicesFile として要求するので、
      # 無いと prebuild も Gradle も通らない。中身はプロジェクトのIDと鍵なので
      # コミットせず（mobile/.gitignore）、Secrets から書き出す。
      #
      # 未登録でもビルドそのものは確かめられるようにしたいので、そのときは
      # 形だけそろえた仮のものを置く。これで作った .apk では通知を受け取れないため、
      # 配る手前の確認（下の「必要な設定があるか確かめる」）で止める。
      - name: google-services.json を置く
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo '::warning::GOOGLE_SERVICES_JSON が未登録のため、仮の google-services.json でビルドします（通知は受け取れません）。'
            cat > google-services.json <<'PLACEHOLDER'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "sukusuku-placeholder",
              "storage_bucket": "sukusuku-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.sukusuku.app" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyPlaceholderPlaceholderPlaceholder00" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          PLACEHOLDER
          fi

      # 設定タブに出す「どのコミットの .apk か」を、JSのソースとして書き出す。
      # 環境変数で渡すとGradle Build Cacheの鍵に入らず、ソースが変わらない
      # ビルドでは古いJSバンドルが再利用されて目印が更新されない（PR #133）。
      # ソースファイルなら中身が変わった時点でバンドルも作り直される。
      - name: ビルドの目印を書き出す
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cat > src/lib/buildInfo.ts <<EOF
          // このファイルはCIが書き換えている（.github/workflows/mobile-apk.yml）。
          // もとの内容と、なぜソースファイルに書くのかは、その版のコメントを参照。
          export const BUILD_COMMIT: string = '${BUILD_COMMIT:0:7}';
          export const BUILD_NUMBER: string = '${BUILD_NUMBER}';
          EOF
          cat src/lib/buildInfo.ts

      # android/ はコミットしていない（mobile/.gitignore）ので毎回生成する。
      # modules/nursing-alarm（前面サービス）は autolinking で自動的に組み込まれる。
      # ANDROID_VERSION_CODE はここで android/app/build.gradle に焼き込まれる
      # （app.config.js）。run_number は同じワークフローの実行のたびに増えるので、
      # Firebase App Distributionの表示がビルドごとに変わるようにする。
      - name: npx expo prebuild --platform android --no-install
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      # assembleRelease はJSを .apk に同梱するので、Metroを立てなくても単体で動く。
      # 署名はExpoが用意するdebug用の鍵のまま（ストアに出さないので足りる）。
      # 既定では armeabi-v7a / arm64-v8a / x86 / x86_64 の4つぶんネイティブを
      # ビルドするため、ここだけで37分かかっていた（実測。ほかの工程は全部で2分弱）。
      # 入れる端末はどちらも arm64 なので、作るのを arm64-v8a だけにする。
      # 上書きの仕方は prebuild が生成する android/gradle.properties に書いてある。
      # x86 系が要るのはエミュレータで動かすときだが、それは手元で作れば済む。
      - name: .apk を作る
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        # Gradle Build Cache を有効化する。android/ は prebuild で毎回作り直され
        # gradle.properties も消えるため、直前にここで追記する。ソースが変わって
        # いないタスクの再実行を省き、setup-java の cache: gradle で ~/.gradle/caches
        # ごと次回のrunへ持ち越す。
        run: |
          echo 'org.gradle.caching=true' >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # 署名鍵。既定ではExpoのdebug鍵（誰のExpoプロジェクトにも同じものが入っている
      # 共有の鍵）で署名されるため、自分たちのものだと示せない。Androidの
      # デベロッパー確認（2027年に日本へ拡大予定）では、パッケージ名を自分の鍵と
      # 一緒に登録することになるので、その前に自分たちの鍵へ移しておく
      # （docs/store-release.md §3）。
      #
      # ANDROID_KEYSTORE_BASE64 が未登録のあいだは今までどおりdebug鍵のまま。
      # 登録して初めて切り替わる。**切り替えた最初の1回は、家族の端末で
      # いったんアンインストールしてから入れ直す**（署名が変わると上書きできない）。
      - name: 自分たちの鍵で署名し直す
        working-directory: mobile/android/app/build/outputs/apk/release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::warning::ANDROID_KEYSTORE_BASE64 が未登録のため、Expoのdebug鍵のまま配ります（docs/store-release.md §3）。'
            exit 0
          fi
          # build-tools は版が増えるので、入っている中でいちばん新しいものを使う。
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            app-release.apk
          rm -f "$RUNNER_TEMP/release.keystore" app-release.apk.idsig
          # どの鍵で署名されたかを実行ログに残す（入れ替えの確認に使う）。
          "$APKSIGNER" verify --print-certs app-release.apk

      # EXPO_PUBLIC_* はビルド時にJSへ埋め込まれ、google-services.json は通知の宛先を
      # 決める。どちらも未設定のまま作った .apk は起動した瞬間に落ちる／通知を
      # 受け取れないだけなので、配らずにここで止める。ビルドが通るかどうかは
      # 設定が無くても分かるので、確認はビルドの後に置いている。
      # 値はリポジトリの Settings > Secrets and variables > Actions に登録する
      # （Web版の .env.local と同じ Supabase プロジェクトの URL と anon key、
      #  および Firebase コンソールから落とした google-services.json の中身。
      #  手順は docs/notifications.md §11）。
      - name: 必要な設定があるか確かめる
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo '::error::ビルドは通りましたが、EXPO_PUBLIC_SUPABASE_URL と EXPO_PUBLIC_SUPABASE_ANON_KEY が Actions の Secrets に未登録のため .apk を配りません。'
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo '::error::ビルドは通りましたが、GOOGLE_SERVICES_JSON が Actions の Secrets に未登録のため .apk を配りません（通知を受け取れません。docs/notifications.md §11）。'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sukusuku-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 配るのは手動実行で distribute を on にしたときだけ（既定は on）。
      # 走らせたブランチの中身がそのまま端末へ届くので、配るのは基本的にmainから。
      # FIREBASE_SERVICE_ACCOUNT / FIREBASE_ANDROID_APP_ID は
      # docs/mobile-distribution.md の手順で登録する。未登録の間はビルド確認だけ
      # できればよいので、エラーにはせず警告して抜ける。
      - name: Firebase App Distribution へ配布
        if: ${{ inputs.distribute }}
        working-directory: mobile
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          # 手動実行では head_commit が無いので、走らせた地点のコミットから作る。
          RELEASE_NOTES=$(git log -1 --pretty='%s')
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
            echo '::warning::FIREBASE_SERVICE_ACCOUNT か FIREBASE_ANDROID_APP_ID が未登録のため配布をスキップします（docs/mobile-distribution.md）。'
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups family \
            --release-notes "$RELEASE_NOTES"
