# mobile/（Androidネイティブ版）の .apk を PRごとに作る。
#
# 凍結の原因は「開発環境にAndroid SDKが無く、mobile/ へ入れたものが実機で一度も
# 動いていない」ことだった（docs/native-app-rewrite.md の【現況】）。PWA側が
# Vercelのプレビューで PRごとに実機で確かめられるのと同じ状態を、ネイティブ側にも
# 用意して原因そのものを潰す。
#
# できた .apk は Actions の実行ページ > Artifacts から落として端末へ直接入れる
# （ストアには出さない方針。docs/native-app-rewrite.md §8）。
name: mobile APK

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

# 同じブランチへ続けてpushしたときは古い実行を止める（Actionsの時間を無駄にしない）。
concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.81 のビルドには JDK 17 以上が要る。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ランナーにAndroid SDKは入っているが、必要なplatform/build-toolsの取得と
      # ライセンス同意をこれに任せる。
      - uses: android-actions/setup-android@v3

      - run: npm ci

      - run: npm run typecheck

      # EXPO_PUBLIC_* はビルド時にJSへ埋め込まれる。未設定のまま作った .apk は
      # 起動した瞬間に落ちるだけで端末に入れる手間が無駄になるので、先に止める。
      # 値はリポジトリの Settings > Secrets and variables > Actions に登録する
      # （Web版の .env.local と同じ Supabase プロジェクトの URL と anon key）。
      - name: Supabaseの設定があるか確かめる
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo '::error::EXPO_PUBLIC_SUPABASE_URL と EXPO_PUBLIC_SUPABASE_ANON_KEY を Actions の Secrets に登録してください。'
            exit 1
          fi

      # android/ はコミットしていない（mobile/.gitignore）ので毎回生成する。
      # modules/nursing-alarm（前面サービス）は autolinking で自動的に組み込まれる。
      - run: npx expo prebuild --platform android --no-install

      # assembleRelease はJSを .apk に同梱するので、Metroを立てなくても単体で動く。
      # 署名はExpoが用意するdebug用の鍵のまま（ストアに出さないので足りる）。
      - name: .apk を作る
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sukusuku-apk-${{ github.event.pull_request.number || github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
