# Edge Functions を統合プロジェクト Persol（jmysgeulujggdmdthqkn）へデプロイする。
# 関数（supabase/functions）を変えたコミットが main に入ったとき、または手動で動かす。
# 各関数の verify_jwt は supabase/config.toml のとおり（すべて false。関数側で確かめる）。
# 必要な Secrets: SUPABASE_ACCESS_TOKEN（Supabase のアカウントのアクセストークン）
name: deploy edge functions

on:
  push:
    # 切り替え前に Persol へ載せるため、移行の作業ブランチでも動かす（マージ後に外す）
    branches: [main, claude/eager-goodall-2bjzv3]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Actions の Secrets に SUPABASE_ACCESS_TOKEN が未登録です。'
            exit 1
          fi
          supabase functions deploy --project-ref jmysgeulujggdmdthqkn --use-api
