plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.sukusuku'
version = '0.1.0'

android {
  namespace 'com.sukusuku.nursingalarm'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // WakeSyncMessagingService が expo-notifications のサービスを継ぎ、FCMのメッセージ型を使う。
  // firebase-messaging の版は expo-notifications に合わせてある。
  implementation project(':expo-notifications')
  implementation 'com.google.firebase:firebase-messaging:24.0.1'
}
